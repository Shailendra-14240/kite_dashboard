<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Kite Risk Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Kite Risk Dashboard</h1>
    <div>
      <span id="last-updated"></span>
      <button id="refresh-btn">Refresh now</button>
      <a href="/trades" class="link">Trades</a>
      <a href="/pl" class="link">P&amp;L</a>
      <a href="/logout" class="link">Logout</a>
    </div>
  </header>

  <section id="funds-summary" class="cards"></section>

  <section id="alerts"></section>

  <section>
    <h2>F&amp;O Positions</h2>
    <div id="fo-summary" class="cards"></div>
    <table id="positions-table">
      <thead>
        <tr>
          <th>Symbol</th><th>Side</th><th>Qty</th><th>Type</th><th>Strike</th>
          <th>LTP</th><th>Spot</th><th>Dist. to ITM %</th><th>DTE</th><th>PnL</th><th>Status</th><th>Notes</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h2>Holdings (Portfolio)</h2>
    <div id="holdings-summary" class="cards"></div>
    <table id="holdings-table">
      <thead>
        <tr><th>Symbol</th><th>Qty</th><th>Avg. Cost</th><th>LTP</th><th>PnL</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <p id="error-banner" class="error" style="display:none"></p>

  <script>
    const statusClass = {
      CRITICAL: 'status-critical', WARNING: 'status-warning',
      ITM: 'status-warning', NEAR_ITM: 'status-warning',
      OK: 'status-ok', UNKNOWN: 'status-unknown'
    };

    async function loadData() {
      const res = await fetch('/api/data');
      if (res.status === 401) { window.location = '/'; return; }
      const data = await res.json();
      render(data);
    }

    function render(data) {
      document.getElementById('last-updated').textContent = data.last_updated ? `Updated: ${data.last_updated}` : '';

      const errBanner = document.getElementById('error-banner');
      if (data.error) { errBanner.style.display = 'block'; errBanner.textContent = data.error; }
      else { errBanner.style.display = 'none'; }

      const fs = data.funds_summary || {};
      document.getElementById('funds-summary').innerHTML = `
        <div class="card"><div class="label">Available Cash</div><div class="value">₹${fmt(fs.available_cash)}</div></div>
        <div class="card"><div class="label">Margin Used</div><div class="value">₹${fmt(fs.used_margin)}</div></div>
        <div class="card"><div class="label">Net</div><div class="value">₹${fmt(fs.net)}</div></div>
      `;

      const alertsEl = document.getElementById('alerts');
      alertsEl.innerHTML = (data.alerts || []).map(a => `
        <div class="alert alert-${a.level.toLowerCase()}"><b>${a.level}</b> — ${a.symbol}: ${a.message}</div>
      `).join('') || '<p class="muted">No active alerts.</p>';

      const posBody = document.querySelector('#positions-table tbody');

      const fo = data.positions || [];
      const foPnl = fo.reduce((s, p) => s + (Number(p.pnl) || 0), 0);
      const premCollected = fo.filter(p => p.is_option && p.side === 'SHORT')
        .reduce((s, p) => s + (Number(p.average_price) || 0) * Math.abs(p.quantity), 0);
      const premPaid = fo.filter(p => p.is_option && p.side === 'LONG')
        .reduce((s, p) => s + (Number(p.average_price) || 0) * Math.abs(p.quantity), 0);
      document.getElementById('fo-summary').innerHTML = `
        <div class="card"><div class="label">F&amp;O Total P&amp;L</div><div class="value ${pnlClass(foPnl)}">${fmtPnl(foPnl)}</div></div>
        <div class="card"><div class="label">Premium Collected (Short options)</div><div class="value pnl-positive">₹${fmt(premCollected)}</div></div>
        <div class="card"><div class="label">Premium Paid (Long options)</div><div class="value">₹${fmt(premPaid)}</div></div>
        <div class="card"><div class="label">Premium Net</div><div class="value ${pnlClass(premCollected - premPaid)}">₹${fmt(premCollected - premPaid)}</div></div>
      `;

      posBody.innerHTML = (data.positions || []).map(p => `
        <tr class="${statusClass[p.status] || ''}">
          <td>${p.tradingsymbol}</td>
          <td>${p.side}</td>
          <td>${p.quantity}</td>
          <td>${p.option_type || (p.is_option ? '' : 'FUT')}</td>
          <td>${fmtNum(p.strike)}</td>
          <td>${fmtNum(p.last_price)}</td>
          <td>${fmtNum(p.spot)}</td>
          <td>${p.distance_to_itm_pct != null ? p.distance_to_itm_pct.toFixed(2) + '%' : ''}</td>
          <td>${p.days_to_expiry ?? ''}</td>
          <td class="${pnlClass(p.pnl)}">${fmtPnl(p.pnl)}</td>
          <td>${p.status}</td>
          <td>${(p.notes || []).join('<br>')}</td>
        </tr>
      `).join('');

      const holdBody = document.querySelector('#holdings-table tbody');
      const hold = data.holdings || [];
      const holdPnl = hold.reduce((s, h) => s + (Number(h.pnl) || 0), 0);
      document.getElementById('holdings-summary').innerHTML = `
        <div class="card"><div class="label">Holdings Total P&amp;L</div><div class="value ${pnlClass(holdPnl)}">${fmtPnl(holdPnl)}</div></div>
      `;
      holdBody.innerHTML = hold.map(h => `
        <tr>
          <td>${h.tradingsymbol}</td>
          <td>${fmt(h.quantity)}</td>
          <td>${fmtNum(h.average_price)}</td>
          <td>${fmtNum(h.last_price)}</td>
          <td class="${pnlClass(h.pnl)}">${fmtPnl(h.pnl)}</td>
        </tr>
      `).join('');
    }

    function num(n) {
      const v = Number(n);
      return (n === null || n === undefined || Number.isNaN(v)) ? null : v;
    }

    function fmt(n) {
      const v = num(n);
      if (v === null) return 'N/A';
      return v.toLocaleString('en-IN', {maximumFractionDigits: 0});
    }

    function fmtNum(n) {
      const v = num(n);
      if (v === null) return '';
      return v.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function fmtPnl(n) {
      const v = num(n);
      if (v === null) return '';
      const prefix = v >= 0 ? '+' : '';
      return prefix + v.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function pnlClass(n) {
      const v = num(n);
      if (v === null) return '';
      return v >= 0 ? 'pnl-positive' : 'pnl-negative';
    }

    document.getElementById('refresh-btn').addEventListener('click', async () => {
      await fetch('/api/refresh', { method: 'POST' });
      loadData();
    });

    loadData();
    setInterval(loadData, 30000); // poll every 30s
  </script>
</body>
</html>
